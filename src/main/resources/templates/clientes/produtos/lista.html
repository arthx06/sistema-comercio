<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos Cadastrados</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Produtos Cadastrados</h1>

    <!-- Se a lista estiver vazia -->
    <div th:if="${#lists.isEmpty(produtos)}" class="mensagem-vazia">
        <p>Nenhum produto cadastrado.</p>
    </div>

    <!-- Se houver produtos cadastrados -->
    <table th:unless="${#lists.isEmpty(produtos)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço (R$)</th>
            <th>Quantidade em Estoque</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${produtos}">
            <td th:text="${prod.id}">1</td>
            <td th:text="${prod.nome}">Produto Exemplo</td>
            <td th:text="${#numbers.formatDecimal(prod.preco, 1, 'POINT', 2, 'COMMA')}">0,00</td>
            <td th:text="${prod.estoque}">0</td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/produtos/novo}" class="btn btn-primary">Cadastrar novo produto</a>
    </div>
</div>
</body>
</html>
