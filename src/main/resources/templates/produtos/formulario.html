<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Cadastrar Produto</h1>

    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
        <div class="form-group">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Teclado Mecânico">
        </div>

        <div class="form-group">
            <label for="preco">Preço (R$):</label>
            <input type="number" step="0.01" id="preco" th:field="*{preco}" required placeholder="Ex: 199.90">
        </div>

        <div class="form-group">
            <label for="estoque">Quantidade em Estoque:</label>
            <input type="number" id="estoque" th:field="*{estoque}" required placeholder="Ex: 15">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/produtos}" class="btn btn-secondary">Voltar para a lista</a>
        </div>
    </form>
</div>
</body>
</html>
